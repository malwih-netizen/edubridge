<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>EduBridge API — Swagger</title>
  <link rel="stylesheet" href="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui.css" />
  <style>
    body { margin: 0; background: #f6f9fd; }
    .eb-bar { display: flex; align-items: center; gap: 12px; padding: 14px 24px; background: #0f2c55; color: #fff; font: 600 15px system-ui, sans-serif; border-bottom: 3px solid #c9952d; }
    .eb-bar b { color: #f0cf86; }
    .eb-bar a { margin-inline-start: auto; color: #f0cf86; font-size: 13px; text-decoration: none; }
    .swagger-ui .topbar { display: none; }
    .swagger-ui .info .title { color: #0f2c55; }
    .swagger-ui .btn.authorize { border-color: #c9952d; color: #b57b18; }
    .swagger-ui .btn.authorize svg { fill: #b57b18; }
  </style>
</head>
<body>
  <div class="eb-bar"><b>EduBridge</b> API documentation <a id="spec-link" href="#">openapi.json</a></div>
  <div id="swagger"></div>
  <script src="https://unpkg.com/swagger-ui-dist@5.17.14/swagger-ui-bundle.js"></script>
  <script>
    // works at /docs (php -S locally) and at /api/docs/ (Apache on the host)
    const SPEC = location.pathname.replace(/docs\/?(index\.html)?$/, '') + 'openapi.json';
    document.getElementById('spec-link').href = SPEC;
    window.ui = SwaggerUIBundle({
      url: SPEC,
      dom_id: '#swagger',
      deepLinking: true,
      persistAuthorization: true,   // keeps the token after a page reload
      displayRequestDuration: true,
      tryItOutEnabled: true,
      docExpansion: 'list',
      defaultModelsExpandDepth: -1,
      // after a successful login in "Try it out", authorize automatically with the returned token
      responseInterceptor: (res) => {
        try {
          if (/\/auth\/(login|register)$/.test(res.url) && res.ok) {
            const token = (typeof res.body === 'object' ? res.body : JSON.parse(res.text)).token;
            if (token) window.ui.preauthorizeApiKey('bearerAuth', token);
          }
        } catch (e) { /* ignore */ }
        return res;
      },
    });
  </script>
</body>
</html>
