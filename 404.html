    <script>
      // ضبط اللغة والاتجاه قبل أول رسم لتجنب وميض الاتجاه الخاطئ
      try {
        var l = localStorage.getItem('edu-lang');
        if (l === 'ar') { document.documentElement.lang = 'ar'; document.documentElement.dir = 'rtl'; }
        var th = localStorage.getItem('edu-theme');
        var dark = th === 'dark' || (th === 'system' && window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
      } catch (e) {}
    </script>
    <style>
      .boot-loader { position: fixed; inset: 0; display: grid; place-items: center; background: #f6f9fd; }
      .boot-mark { position: relative; width: 132px; height: 132px; display: grid; place-items: center; }
      .boot-mark img { width: 92px; height: 92px; object-fit: contain; padding: 14px; border-radius: 50%; background: #fff; box-shadow: 0 10px 30px rgba(15,44,85,.12); }
      .boot-mark svg { position: absolute; inset: 0; width: 100%; height: 100%; animation: boot-spin 1.1s linear infinite; }
      .boot-mark .t { fill: none; stroke: rgba(15,44,85,.08); stroke-width: 5; }
      .boot-mark .a { fill: none; stroke: #c9952d; stroke-width: 5; stroke-linecap: round; stroke-dasharray: 90 260; }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
